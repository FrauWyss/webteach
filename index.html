:root{--ink:#17372d;--soft:#4a6358;--moss:#1f4a3a;--teal:#176a70;--blue:#205c94;--line:#b9cfc4;
--head:Anton,Impact,"Arial Narrow",sans-serif;--body:Figtree,"Segoe UI",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#f7f9f2 url(data:image/webp;base64,UklGRswBAABXRUJQVlA4IMABAACwKwCdASqkAaQBPsFgrVInpaQioAgA8BgJaW7hdftNLb6AFZu14uTkPfbJyHvtlAy9q3x8Joxub9hRWx76HCC7SoFku14uTkPg/dZD32ych77ZOQ99snIe+2TkPfbJyHvtk5D32ych77ZOQ9+RtL9PbJyHvtk5D32ych77ZOQ99snIetURcnIe+2TkPfbJyH4MoYB77ZOQ99snIe+2TkPfbJyHvtk5D32ych77ZOQ99snIfB+6yHvtk5D32ych77ZOQ99snIe+2TkPfbJyHvtk5D32ych78jaX6e2TkPfbJyHvtk5D32ych77ZOQ99snIe+2TkPfbJyHvuACB77ZOQ99snIe+2TkPfbJyHvtk5D32ych77ZOQ99snIe+2dhI4QXaVAsl2vFych77ZOQ99snIe+2OcGAe+2TkPfbJyHvUEydZD32ych77ZOQ99snIe+2TkPfbJyHvtXHLKr32rIiIdRGEeAAP7/TjiCYpWUxSspilZTFKymKVlMUrKYlvs4NIKOKEAL8qBa8IAX5UC2YQBJOcqBNyEAL8qBa8IAX5UDROeEAGMVAteEAL8qBbMIAYpUC1/Qf5d84FnhaBAA);color:var(--ink);font:16px/1.5 var(--body)}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
.banner{background:#cfe4ee;font-size:14px;padding:8px 24px;text-align:center}
.hero{position:relative;overflow:hidden}
.bar{max-width:1200px;margin:0 auto;padding:30px 28px 0;display:flex;justify-content:space-between;align-items:center;gap:20px}
.lead{font-size:clamp(17px,1.7vw,21px);font-weight:600;margin:0;max-width:30em}
.mark{position:relative;text-align:center;margin-top:clamp(10px,2vw,26px)}
h1{font:400 min(24vw,370px)/1.08 var(--head);margin:0;color:var(--moss);text-transform:uppercase;letter-spacing:.005em;white-space:nowrap}
.leaf{position:absolute;z-index:3;pointer-events:none;width:clamp(58px,10vw,150px)}
.leaf.a{left:14%;top:17%;transform:rotate(-38deg)}
.leaf.b{left:56%;top:7%;transform:rotate(24deg)}
.leaf.c{right:9%;top:42%;transform:rotate(148deg)}
.hills{display:block;position:relative;z-index:2;width:100%;height:auto;margin-top:min(-15vw,-60px)}
.hills{min-height:170px;object-fit:cover;object-position:bottom}
.band{background:var(--moss);padding:6px 0 30px;position:relative;z-index:2}
.search input{width:100%;padding:16px 18px;font-size:18px;border:0;border-radius:0;background:#fbfcf8}
.filters{padding-top:24px}
.btn{border:0;border-radius:2px;padding:11px 18px;background:var(--moss);color:#fff;font-weight:700;cursor:pointer}
.btn:hover{background:var(--teal)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{background:#e8f1ea}
.btn.small{padding:6px 11px;font-size:14px}
.btn.danger{background:#fff;color:#a12a22;box-shadow:inset 0 0 0 1.5px #e6bcb7}
.btn.danger:hover{background:#fbe9e7}
.tabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tab{border:0;background:var(--tab,#fff);padding:6px 13px;border-radius:0;cursor:pointer;font-size:15px;font-weight:600}
.tab:hover{box-shadow:inset 0 -3px 0 var(--moss)}
.tab[aria-pressed=true]{background:var(--moss);color:#fff}
.tab.all{background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.tab.all[aria-pressed=true]{background:var(--moss);box-shadow:none}
.row2{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 0;color:var(--soft);font-size:15px}
.check{display:inline-flex;gap:8px;align-items:center;cursor:pointer;color:var(--ink)}
.check input{width:18px;height:18px;accent-color:var(--moss)}
main{padding:34px 0 60px}
.folder{position:relative;margin:0 0 30px;padding:30px 36px 36px;scroll-margin-top:12px}
.folder::before{content:"";position:absolute;inset:0;background:var(--tab);opacity:.8;-webkit-mask:var(--w0) center/100% 100% no-repeat;mask:var(--w0) center/100% 100% no-repeat}
.folder:nth-child(3n+2)::before{-webkit-mask-image:var(--w1);mask-image:var(--w1)}
.folder:nth-child(3n)::before{-webkit-mask-image:var(--w2);mask-image:var(--w2)}
.folder>*{position:relative}
.folder h2{margin:0 0 14px;font:400 clamp(34px,4.6vw,54px)/1.1 var(--head);color:var(--moss)}
.sheet h3{font:700 17px/1.2 var(--body);margin:20px 0 9px}
.sheet h3:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{position:relative;background:rgba(255,255,255,.94);border-radius:0;padding:13px 14px 11px;display:flex;flex-direction:column;gap:6px;min-height:118px}
.card:hover{box-shadow:inset 0 0 0 2px var(--moss)}
.head{display:flex;align-items:center;gap:9px}
.ico{flex:none;position:relative;width:28px;height:28px;border-radius:2px;background:var(--bg);display:grid;place-items:center;font:700 15px/1 var(--body);overflow:hidden}
.ico img{position:absolute;inset:4px;width:20px;height:20px;background:var(--bg)}
.card .t{font:700 18px/1.2 var(--body);margin:0}
.card .t a{color:var(--ink);text-decoration:none}
.card .t a::after{content:"";position:absolute;inset:0}
.card .t a:hover{color:var(--blue)}
.card .t a:focus-visible{outline:0}
.card .t a:focus-visible::after{outline:3px solid var(--blue)}
.card p{margin:0;font-size:14.5px;line-height:1.42;flex:1}
.card .d{font-size:13px;color:var(--blue);overflow-wrap:anywhere}
.star{align-self:flex-start;background:var(--tab);font-size:12.5px;font-weight:700;padding:1px 7px}
.empty{background:rgba(255,255,255,.85);padding:18px}
.none{padding:34px;background:#fff;text-align:center}
footer{border-top:1.5px solid var(--line);padding:20px 0 32px;color:var(--soft);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--soft)}
dialog{border:0;border-radius:0;padding:0;width:min(560px,calc(100vw - 24px));color:var(--ink);background:#fbfcf8}
dialog::backdrop{background:rgba(23,55,45,.55)}
form.f{padding:24px;display:grid;gap:13px}
form.f h2{font:400 34px/1.1 var(--head);margin:0;color:var(--moss)}
form.f p{margin:0}
label.l{display:grid;gap:4px;font-weight:600;font-size:15px}
label.l small{font-weight:400;color:var(--soft)}
label.l input,label.l select,label.l textarea{font-weight:400;width:100%;padding:9px 11px;border:1.5px solid #93b0a3;border-radius:0;background:#fff}
.hp{position:absolute;left:-9999px}
.acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.msg{font-size:15px;color:#a12a22;min-height:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--moss);color:#fff;padding:11px 18px;z-index:9;max-width:calc(100vw - 30px)}
.admin h2{font:400 42px/1.1 var(--head);color:var(--moss);margin:0 0 12px}
.admin h3{font:700 21px/1.2 var(--body);margin:32px 0 10px}
.login{background:#fff;max-width:420px}
.a-row{background:var(--bg,#fff);padding:11px 13px;margin:0 0 6px;display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.a-row .i{flex:1;min-width:240px}
.a-row b{font:700 17px/1.25 var(--body)}
.a-row small{display:block;color:var(--ink);overflow-wrap:anywhere}
.a-acts{display:flex;gap:6px;flex-wrap:wrap}
[hidden]{display:none!important}
@media(max-width:600px){.wrap,.bar{padding-left:14px;padding-right:14px}.bar{padding-top:18px;align-items:flex-start}.folder{padding:20px 18px 24px}.btn#suggest{flex:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

async function rest(path,opt={}){
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...opt,headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{}),...(opt.headers||{})}});

}

function card(e){
  const u=safeUrl(e.url);

    e.recommended?el("span",{class:"star"},"★ Empfehlung"):null,
    el("div",{class:"head"},icon(e),el("h4",{class:"t"},u?el("a",{href:u,target:"_blank",rel:"noopener noreferrer"},e.title):e.title)),
    el("p",{},e.note||""),el("span",{class:"d"},domain(e.url)));
}
function render(){
  renderTabs();
  const q=norm($("#q").value).trim().split(/\s+/).filter(Boolean),star=$("#onlyStar").checked;
  const hit=rows.filter(e=>(!active||e.category===active)&&(!star||e.recommended)&&q.every(w=>norm([e.title,e.note,e.url,e.category,e.subgroup].join(" ")).includes(w)));
  const box=$("#list");box.replaceChildren();
  $("#count").textContent=hit.length===1?"1 Tool":hit.length+" Tools";
  const filtering=q.length||star;
  let shown=0;
  CATS.forEach(([n])=>{
    if(active&&active!==n)return;
    const items=hit.filter(e=>e.category===n);
    if(!items.length&&filtering)return;
    shown++;
    const sheet=el("div",{class:"sheet"});
    if(!items.length){sheet.append(el("div",{class:"empty"},"Hier ist noch nichts eingetragen. ",el("a",{href:"#",onclick:ev=>{ev.preventDefault();openSuggest(n)}},"Erstes Tool vorschlagen")))}

    groups.forEach(g=>{if(g)sheet.append(el("h3",{},g));sheet.append(el("div",{class:"grid"},...items.filter(e=>(e.subgroup||"")===g).map(card)))});
    box.append(el("section",{class:"folder",style:colors(n)},el("h2",{},n),sheet));
  });
  if(!shown){
    box.append(el("div",{class:"none"},star&&!rows.some(e=>e.recommended)?"Es sind noch keine Empfehlungen markiert.":"Keine Tools gefunden. Versuche einen anderen Suchbegriff oder schlag das Tool vor."));
  }
}

}
function route(){
  const adm=location.hash==="#verwaltung";$("#public").hidden=adm;$("#admin").hidden=!adm;
  $("#toggleAdmin").textContent=adm?"Zur Übersicht":"Verwaltung";
  if(adm)renderAdmin();else loadPublic();window.scrollTo(0,0);
}
$("#toggleAdmin").onclick=ev=>{ev.preventDefault();location.hash=location.hash==="#verwaltung"?"":"#verwaltung";if(!location.hash)route()};
$("#suggest").onclick=()=>openSuggest();
$("#q").oninput=render;$("#onlyStar").onchange=render;
window.addEventListener("hashchange",route);
$("#demo").hidden=!DEMO;
route();
</script>
</body>
</html>
