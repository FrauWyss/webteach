<style>
:root{--ink:#12384a;--soft:#4b6775;--teal:#0f6f78;--blue:#2259a0;--page:#f0f8f7;--line:#c9dfdf;--white:#fff;

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.5 var(--body)}

.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.banner{background:#d5e8f8;font-size:14px;padding:8px 24px;text-align:center}
header.top{padding:48px 0 12px}
.brand{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap}

.lead{font-size:20px;margin:14px 0 0;max-width:34em;color:var(--ink)}
.btn{border:0;border-radius:8px;padding:11px 18px;background:var(--teal);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:#0b5a62}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{background:#e4f1f0}
.btn.small{padding:6px 11px;font-size:14px}
.btn.danger{background:#fff;color:#a12a22;box-shadow:inset 0 0 0 1.5px #e6bcb7}
.btn.danger:hover{background:#fbe9e7}
.search{margin:30px 0 18px;position:relative}
.search input{width:100%;padding:15px 18px;font-size:18px;border:2px solid var(--teal);border-radius:10px;background:#fff}
.tabs{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.tab{border:0;background:var(--tab,#fff);padding:6px 13px;border-radius:7px;cursor:pointer;font-size:15px;box-shadow:inset 0 0 0 1.5px transparent}
.tab[aria-pressed=true]{box-shadow:inset 0 0 0 2.5px var(--ink);font-weight:600}

.card{position:relative;background:#fff;border-radius:9px;padding:14px 15px 12px;display:flex;flex-direction:column;gap:6px;min-height:118px}

.card .t{font:600 19px/1.2 var(--head);margin:0}

.card .t a::after{content:"";position:absolute;inset:0;border-radius:9px}
.card .t a:hover{color:var(--blue)}
.card .t a:focus-visible{outline:0}
.card .t a:focus-visible::after{outline:3px solid var(--blue)}
.head{display:flex;align-items:center;gap:9px}
.ico{flex:none;position:relative;width:28px;height:28px;border-radius:7px;background:var(--bg);display:grid;place-items:center;font:600 15px/1 var(--head);overflow:hidden}
.ico img{position:absolute;inset:4px;width:20px;height:20px;background:var(--bg)}
.card p{margin:0;font-size:14.5px;line-height:1.42;flex:1}
.card .d{font-size:13px;color:var(--blue);overflow-wrap:anywhere}
.star{align-self:flex-start;background:var(--tab);font-size:12.5px;font-weight:600;border-radius:5px;padding:1px 7px}
.empty{background:rgba(255,255,255,.75);border-radius:9px;padding:18px}
.none{padding:34px;background:#fff;border-radius:12px;text-align:center}
footer{border-top:1.5px solid var(--line);padding:20px 0 32px;color:var(--soft);font-size:14px}

footer a{color:var(--soft)}
dialog{border:0;border-radius:14px;padding:0;width:min(560px,calc(100vw - 24px));color:var(--ink)}
dialog::backdrop{background:rgba(18,56,74,.45)}
form.f{padding:24px;display:grid;gap:13px}
form.f h2{font:600 28px/1.1 var(--head);margin:0;color:var(--teal)}
form.f p{margin:0}
label.l{display:grid;gap:4px;font-weight:600;font-size:15px}
label.l small{font-weight:400;color:var(--soft)}
label.l input,label.l select,label.l textarea{font-weight:400;width:100%;padding:9px 11px;border:1.5px solid #9dbcc0;border-radius:7px;background:#fff}
.hp{position:absolute;left:-9999px}
.acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.msg{font-size:15px;color:#a12a22;min-height:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:9px;z-index:9;max-width:calc(100vw - 30px)}
.admin h2{font:600 30px/1.1 var(--head);color:var(--teal);margin:0 0 12px}
.admin h3{font:600 22px/1.2 var(--head);margin:32px 0 10px}
.login{background:#fff;border-radius:12px;max-width:420px}
.a-row{background:var(--bg,#fff);border-radius:9px;padding:11px 13px;margin:0 0 7px;display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap}

.a-acts{display:flex;gap:6px;flex-wrap:wrap}
[hidden]{display:none!important}

@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

const COLS="id,title,category,subgroup,note,url,recommended,sort,created_at";
async function rest(path,opt={}){
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...opt,headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{}),...(opt.headers||{})}});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.status===204||r.status===201?null:r.json();
}
const api={
  list:()=>DEMO?Promise.resolve(demoRows.filter(r=>r.status==="approved")):rest(`entries?select=${COLS}&status=eq.approved&order=sort.asc,created_at.asc`),
  submit:async o=>{if(DEMO){demoRows.push({id:"n"+Date.now(),status:"pending",recommended:false,sort:9999,subgroup:null,...o});return}await rest("entries",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(o)})},
  login:async(email,password)=>{if(DEMO){demoAuth=true;return}
    const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});
    if(!r.ok)throw new Error("login");token=(await r.json()).access_token},
  all:()=>DEMO?Promise.resolve([...demoRows]):rest("entries?select=*&order=sort.asc,created_at.asc"),
  update:async(id,p)=>{if(DEMO){Object.assign(demoRows.find(r=>r.id===id),p);return}await rest("entries?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(p)})},
  remove:async id=>{if(DEMO){demoRows=demoRows.filter(r=>r.id!==id);return}await rest("entries?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:{Prefer:"return=minimal"}})}
};
const authed=()=>DEMO?demoAuth:!!token;

/* Öffentliche Ansicht */
let rows=[],active=null;
const norm=s=>(s||"").toLowerCase();
function renderTabs(){
  const t=$("#tabs");t.replaceChildren(el("button",{class:"tab all",ariaPressed:String(!active),onclick:()=>{active=null;render()}},"Alle"));
  CATS.forEach(([n,,tab])=>t.append(el("button",{class:"tab",style:"--tab:"+tab,ariaPressed:String(active===n),onclick:()=>{active=active===n?null:n;render()}},n)));
  t.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.ariaPressed));
}
function icon(e){
  const box=el("span",{class:"ico","aria-hidden":"true"},(e.title||"?").trim().charAt(0).toUpperCase());
  let host="";try{host=new URL(e.url).hostname}catch{}
  if(host){
    const img=el("img",{alt:"",loading:"lazy",referrerPolicy:"no-referrer",width:20,height:20});
    img.onerror=()=>img.remove();
    img.onload=()=>{if(img.naturalWidth<8)img.remove()};
    img.src="https://icons.duckduckgo.com/ip3/"+encodeURIComponent(host)+".ico";
    box.append(img);
  }
  return box;
}
function card(e){
  const u=safeUrl(e.url);
  return el("article",{class:"card"},
    e.recommended?el("span",{class:"star"},"★ Empfehlung"):null,
    el("div",{class:"head"},icon(e),el("h4",{class:"t"},u?el("a",{href:u,target:"_blank",rel:"noopener noreferrer"},e.title):e.title)),
    el("p",{},e.note||""),el("span",{class:"d"},domain(e.url)));
}
function render(){
  renderTabs();
  const q=norm($("#q").value).trim().split(/\s+/).filter(Boolean),star=$("#onlyStar").checked;
  const hit=rows.filter(e=>(!active||e.category===active)&&(!star||e.recommended)&&q.every(w=>norm([e.title,e.note,e.url,e.category,e.subgroup].join(" ")).includes(w)));
  const box=$("#list");box.replaceChildren();
  $("#count").textContent=hit.length===1?"1 Tool":hit.length+" Tools";
  const filtering=q.length||star;
  let shown=0;
  CATS.forEach(([n])=>{
    if(active&&active!==n)return;
    const items=hit.filter(e=>e.category===n);
    if(!items.length&&filtering)return;
    shown++;
    const sheet=el("div",{class:"sheet"});
    if(!items.length){sheet.append(el("div",{class:"empty"},"Hier ist noch nichts eingetragen. ",el("a",{href:"#",onclick:ev=>{ev.preventDefault();openSuggest(n)}},"Erstes Tool vorschlagen")))}
    const groups=[...new Set(items.map(e=>e.subgroup||""))];
    groups.forEach(g=>{if(g)sheet.append(el("h3",{},g));sheet.append(el("div",{class:"grid"},...items.filter(e=>(e.subgroup||"")===g).map(card)))});
    box.append(el("section",{class:"folder",style:colors(n)},el("h2",{},n),sheet));
  });
  if(!shown){
    box.append(el("div",{class:"none"},star&&!rows.some(e=>e.recommended)?"Es sind noch keine Empfehlungen markiert.":"Keine Tools gefunden. Versuche einen anderen Suchbegriff oder schlag das Tool vor."));
  }
}
async function loadPublic(){
  try{rows=await api.list();render()}
  catch{$("#list").replaceChildren(el("div",{class:"none"},"Die Tools konnten nicht geladen werden. Lade die Seite neu."))}
}

/* Formular */
const field=(lab,hint,ctrl)=>el("label",{class:"l"},lab,hint?el("small",{},hint):null,ctrl);
const catSelect=v=>el("select",{name:"category",required:true},el("option",{value:""},"Bitte wählen"),...CATS.map(([n])=>el("option",{value:n,selected:n===v},n)));
function fixUrl(v){v=v.trim();if(v&&!/^https?:\/\//i.test(v))v="https://"+v;return v}
function validate(o){if(!o.title)return"Gib einen Namen an.";if(!o.category)return"Wähle ein Fach aus.";if(!safeUrl(o.url)||!domain(o.url).includes("."))return"Gib einen gültigen Link an, z. B. https://beispiel.ch.";return""}
function openSuggest(pre){
  const f=$("#form"),msg=el("p",{class:"msg",role:"alert"});
  f.replaceChildren(el("h2",{},"Tool vorschlagen"),el("p",{},"Dein Vorschlag erscheint, sobald er geprüft und freigegeben ist."),
    field("Name des Tools",null,el("input",{name:"title",maxLength:120,required:true})),
    field("Fach",null,catSelect(pre)),
    field("Link",null,el("input",{name:"url",inputMode:"url",maxLength:1000,required:true,placeholder:"https://"})),
    field("Wozu ist es gut?","Zum Beispiel: Einsatz im Unterricht, ob ein Login nötig ist",el("textarea",{name:"note",rows:3,maxLength:400})),
    field("Dein Name (freiwillig)","Sichtbar nur für die Verwaltung",el("input",{name:"submitter",maxLength:80,autocomplete:"name"})),
    el("div",{class:"hp","aria-hidden":"true"},el("label",{},"Website",el("input",{name:"website",tabIndex:-1,autocomplete:"off"}))),
    msg,el("div",{class:"acts"},el("button",{class:"btn ghost",type:"button",onclick:()=>$("#dlg").close()},"Abbrechen"),el("button",{class:"btn",type:"submit"},"Vorschlag senden")));
  f.onsubmit=async ev=>{ev.preventDefault();const d=new FormData(f);
    if(d.get("website")){$("#dlg").close();return}
    const o={title:d.get("title").trim(),category:d.get("category"),url:fixUrl(d.get("url")),note:d.get("note").trim()||null,submitter:d.get("submitter").trim()||null};
    const err=validate(o);if(err){msg.textContent=err;return}
    try{await api.submit(o);$("#dlg").close();toast("Vorschlag gesendet. Danke!")}catch{msg.textContent="Der Vorschlag konnte nicht gesendet werden. Versuche es noch einmal."}};
  $("#dlg").showModal();
}
function openEdit(e){
  const f=$("#form"),msg=el("p",{class:"msg",role:"alert"});
  f.replaceChildren(el("h2",{},"Eintrag bearbeiten"),
    field("Name",null,el("input",{name:"title",value:e.title,maxLength:120})),field("Fach",null,catSelect(e.category)),
    field("Unterkategorie","Freiwillig",el("input",{name:"subgroup",value:e.subgroup||"",maxLength:80})),
    field("Link",null,el("input",{name:"url",value:e.url,maxLength:1000})),
    field("Wozu ist es gut?",null,el("textarea",{name:"note",rows:3,maxLength:400,value:e.note||""})),
    msg,el("div",{class:"acts"},el("button",{class:"btn ghost",type:"button",onclick:()=>$("#dlg").close()},"Abbrechen"),el("button",{class:"btn",type:"submit"},"Änderungen speichern")));
  f.onsubmit=async ev=>{ev.preventDefault();const d=new FormData(f);
    const o={title:d.get("title").trim(),category:d.get("category"),subgroup:d.get("subgroup").trim()||null,url:fixUrl(d.get("url")),note:d.get("note").trim()||null};
    const err=validate(o);if(err){msg.textContent=err;return}
    try{await api.update(e.id,o);$("#dlg").close();toast("Änderungen gespeichert.");renderAdmin()}catch{msg.textContent="Die Änderungen konnten nicht gespeichert werden."}};
  $("#dlg").showModal();
}

/* Verwaltung */
function renderLogin(){
  const b=$("#adminBody"),msg=el("p",{class:"msg",role:"alert"});
  const f=el("form",{class:"f login"},el("h2",{},"Verwaltung"),
    DEMO?el("p",{},"In der Vorschau genügt ein Klick auf Anmelden."):null,
    field("E-Mail",null,el("input",{name:"email",type:"email",autocomplete:"username",required:!DEMO})),
    field("Passwort",null,el("input",{name:"pw",type:"password",autocomplete:"current-password",required:!DEMO})),
    msg,el("div",{class:"acts"},el("button",{class:"btn",type:"submit"},"Anmelden")));
  f.onsubmit=async ev=>{ev.preventDefault();const d=new FormData(f);try{await api.login(d.get("email"),d.get("pw"));renderAdmin()}catch{msg.textContent="E-Mail oder Passwort stimmt nicht."}};
  b.replaceChildren(f);
}
const act=(fn,done)=>async()=>{try{await fn();if(done)toast(done);renderAdmin()}catch{toast("Das hat nicht geklappt. Melde dich neu an und versuche es noch einmal.")}};
function aRow(e,btns){
  const u=safeUrl(e.url);
  return el("div",{class:"a-row",style:colors(e.category)},el("div",{class:"i"},el("b",{},e.title),
    el("small",{},e.category+(e.subgroup?", "+e.subgroup:"")),e.note?el("small",{},e.note):null,
    el("small",{},u?el("a",{href:u,target:"_blank",rel:"noopener noreferrer"},u):e.url),
    e.submitter?el("small",{},"Von: "+e.submitter):null),el("div",{class:"a-acts"},...btns));
}
const B=(t,cls,fn)=>el("button",{class:"btn small "+cls,type:"button",onclick:fn},t);
async function renderAdmin(){
  const b=$("#adminBody");if(!authed())return renderLogin();
  let all;try{all=await api.all()}catch{token=null;return renderLogin()}
  const pend=all.filter(e=>e.status==="pending"),ok=all.filter(e=>e.status==="approved");
  const remove=(e,w)=>()=>{if(confirm(`«${e.title}» ${w}?`))act(()=>api.remove(e.id),w==="ablehnen"?"Vorschlag abgelehnt.":"Eintrag gelöscht.")()};
  const out=[el("h2",{},"Verwaltung"),el("h3",{},pend.length?`Neue Vorschläge (${pend.length})`:"Neue Vorschläge")];
  if(!pend.length)out.push(el("p",{},"Es warten keine Vorschläge auf deine Freigabe."));
  pend.forEach(e=>out.push(aRow(e,[B("Freigeben","",act(()=>api.update(e.id,{status:"approved"}),"Eintrag freigegeben.")),B("Bearbeiten","ghost",()=>openEdit(e)),B("Ablehnen","danger",remove(e,"ablehnen"))])));
  out.push(el("h3",{},`Veröffentlichte Einträge (${ok.length})`));
  ok.forEach(e=>out.push(aRow(e,[B(e.recommended?"★ Empfehlung entfernen":"☆ Als Empfehlung markieren","ghost",act(()=>api.update(e.id,{recommended:!e.recommended}))),B("Bearbeiten","ghost",()=>openEdit(e)),B("Löschen","danger",remove(e,"löschen"))])));
  b.replaceChildren(...out);
}
function route(){
  const adm=location.hash==="#verwaltung";$("#public").hidden=adm;$("#admin").hidden=!adm;
  $("#toggleAdmin").textContent=adm?"Zur Übersicht":"Verwaltung";
  if(adm)renderAdmin();else loadPublic();window.scrollTo(0,0);
}
$("#toggleAdmin").onclick=ev=>{ev.preventDefault();location.hash=location.hash==="#verwaltung"?"":"#verwaltung";if(!location.hash)route()};
$("#suggest").onclick=()=>openSuggest();
$("#q").oninput=render;$("#onlyStar").onchange=render;
window.addEventListener("hashchange",route);
$("#demo").hidden=!DEMO;
route();
</script>
</body>
</html>
